[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dice-duck"
version = "0.1.0"
description = "Manipulationssicherer, nachweisbar fairer Würfelbecher mit REST-API für LLM-gemeisterte Pen-&-Paper-Runden."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "cryptography>=42",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
dice-duck = "dice_duck.__main__:main"
dice-duck-verify = "dice_duck.verify:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dice_duck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
